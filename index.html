<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Flueno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Токени ---------- */
:root{
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);
  --tabbar-h:64px;
}
[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2C; --surface-2:#1E2538; --line:#2A3247;
  --text:#EEF1F8; --text-2:#A9B1C7; --text-3:#7C849C;
  --accent:#FFD24A; --accent-ink:#FFD24A; --on-accent:#1A1505;
  --ok:#5FD6A4; --bad:#FF7A6B; --warn:#FFB547; --on-state:#0E1220;
  --lv-A1:#FFD24A; --lv-A2:#5FD6A4; --lv-B1:#6CB8FF; --lv-B2:#B18CFF; --lv-C1:#FF8A7A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#F6F3EA; --surface:#FFFFFF; --surface-2:#EFEBE0; --line:#E0DACB;
  --text:#161A2B; --text-2:#5A6078; --text-3:#7E8399;
  --accent:#F5C21B; --accent-ink:#8A6400; --on-accent:#1A1505;
  --ok:#12805A; --bad:#C8402F; --warn:#B86E00; --on-state:#FFFFFF;
  --lv-A1:#D9A200; --lv-A2:#19A06F; --lv-B1:#2F7FD9; --lv-B2:#7A55D6; --lv-C1:#D9573F;
  --shadow:0 10px 28px -14px rgba(40,30,10,.35), 0 2px 6px -2px rgba(40,30,10,.12);
}

/* ---------- База ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 0;caret-color:var(--accent-ink);
  scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:var(--on-accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:var(--r-sm)}
.app{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--host-bar,0px) + var(--s8))}
.app.full{padding-bottom:0}
.ic{width:24px;height:24px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.ic.xs{width:14px;height:14px;stroke-width:2.4}

h1,.h1{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2,.h2{font-weight:800;font-size:18px;line-height:1.3;margin:0;text-wrap:balance}
.meta{color:var(--text-2);font-size:14px;line-height:1.4;margin:0}
.muted{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:52px;padding:0 var(--s5);
  border-radius:var(--r-md);font-weight:800;font-size:16px;background:var(--accent);color:var(--on-accent);
  transition:transform .18s var(--ease),filter .18s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn.ok{background:var(--ok);color:var(--on-state)}
.btn.bad{background:var(--bad);color:var(--on-state)}
.btn.quiet{background:var(--surface-2);color:var(--text)}
.link{color:var(--accent-ink);font-weight:700}

/* ---------- Сова ---------- */
.owl{display:block;flex:0 0 auto}
.owl .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl.cheer{animation:hop .9s var(--ease) 2}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}

/* ---------- Онбординг ---------- */
.onb{display:flex;flex-direction:column;gap:var(--s6);padding-top:var(--s6)}
.onb-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1}
.wordmark span{color:var(--accent-ink)}
.taglines{display:flex;flex-direction:column;gap:2px;color:var(--text-2);font-size:14px}

/* ---------- Списки-рядки ---------- */
.group{display:flex;flex-direction:column;gap:var(--s2)}
.group-title{font-size:14px;font-weight:700;color:var(--text-2);margin:0 0 var(--s1) var(--s1)}
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:var(--s3) var(--s4);text-align:left}
.list .row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:700;display:block}
.row .sub{display:block;color:var(--text-2);font-size:14px}
.row .value{color:var(--text-2);font-size:15px}
.row .chev{color:var(--text-3)}
.row.on .check{color:var(--accent-ink)}
.row.danger{color:var(--bad);justify-content:center;font-weight:700}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:28px;padding:0 6px;border-radius:8px;
  background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--text)}
.row.on .code{background:var(--accent);color:var(--on-accent)}

/* ---------- Шапка вкладки ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s3) 0 var(--s1);border-radius:999px;background:var(--surface);font-weight:700}
.pill .code{height:32px;border-radius:999px;min-width:40px}
.streak{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 var(--s3);border-radius:999px;background:var(--surface);font-weight:800}
.streak .ic{color:var(--warn)}
.streak.zero .ic{color:var(--text-3)}

/* ---------- Привітання сови ---------- */
.greet{display:flex;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s5)}
.bubble{position:relative;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px;padding:var(--s3) var(--s4);font-weight:700;line-height:1.4;box-shadow:var(--shadow)}
.review{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);margin-bottom:var(--s6);border-radius:var(--r-lg);
  background:color-mix(in oklab,var(--accent) 16%,var(--surface));color:var(--text);font-weight:700}
.review .ic{color:var(--accent-ink)}
.review .grow{flex:1}

/* ---------- Маршрут рівнів ---------- */
.level{--lv:var(--lv-A1);margin-bottom:var(--s8)}
.level-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.lv-badge{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;flex:0 0 auto;
  background:var(--lv);color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:16px}
.level.locked .lv-badge{background:var(--surface-2);color:var(--text-3)}
.level-head .grow{flex:1;min-width:0}
.level-head .state{color:var(--lv)}
.level.locked .level-head .state{color:var(--text-3)}
.lvbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.lvbar i{display:block;height:100%;border-radius:99px;background:var(--lv);transition:width .8s var(--ease)}

.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line);border-radius:2px}
.stop{position:relative}
.stop-btn{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2) 0;text-align:left}
.dot{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:var(--bg);border:2px solid var(--line);color:var(--text-3);font-weight:800;font-size:15px}
.stop.started .dot{border-color:var(--lv);color:var(--lv)}
.stop.done .dot{background:var(--lv);border-color:var(--lv);color:var(--on-accent)}
.stop.closed .dot{border-style:dashed}
.stop-text{flex:1;min-width:0;padding:var(--s2) 0}
.stop-title{display:block;font-weight:700}
.stop.closed .stop-title{color:var(--text-2)}
.stop-meta{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px}
.stop .chev{color:var(--text-3);transition:transform .25s var(--ease)}
.stop.open .chev{transform:rotate(90deg)}

.unit-panel{margin:var(--s1) 0 var(--s3) 56px;padding:var(--s4);background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:var(--s4)}
.stops{display:flex;gap:var(--s3)}
.les{flex:1;aspect-ratio:1;max-width:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text-3);font-weight:800;font-size:16px;position:relative}
.les.done{background:var(--lv);color:var(--on-accent)}
.les.cur{background:var(--accent);color:var(--on-accent)}
.les.cur::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);opacity:.6;animation:ring 1.8s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.les.locked{opacity:.55}
.upnext{display:flex;flex-direction:column;gap:var(--s3)}
.upnext .meta b{color:var(--text)}
.plusnote{display:flex;align-items:center;gap:var(--s2);color:var(--text-2);font-size:14px;margin-top:var(--s2)}
.plusnote .ic{color:var(--accent-ink)}

/* ---------- Картки ---------- */
.screen-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5)}
.flash-wrap{position:relative;perspective:1400px;margin-bottom:var(--s4)}
.flash{display:block;width:100%;height:300px;position:relative;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.flash.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s8) var(--s6);text-align:center;
  background:var(--surface);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
.face .word{font-weight:800;font-size:30px;line-height:1.2;text-wrap:balance}
.face .small{color:var(--text-2);font-size:15px}
.face .corner{position:absolute;top:var(--s4);left:var(--s4)}
.speak{position:absolute;top:var(--s3);right:var(--s3);z-index:2;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text)}
.speak.playing{color:var(--accent-ink)}
.speak.playing .ic{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.hint{text-align:center;color:var(--text-3);font-size:14px;margin:0 0 var(--s4)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center;border-radius:var(--r-md);font-weight:800}
.rate .r0{background:color-mix(in oklab,var(--bad) 18%,var(--surface));color:var(--bad)}
.rate .r3{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}
.rate .r5{background:color-mix(in oklab,var(--ok) 18%,var(--surface));color:var(--ok)}
.rate small{font-weight:600;font-size:12px;opacity:.85}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s10) var(--s4)}

/* ---------- Профіль ---------- */
.stack{display:flex;flex-direction:column;gap:var(--s6)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--surface-2);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text-2);transition:transform .25s var(--ease),background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px);background:var(--on-accent)}

/* ---------- Урок ---------- */
.lesson{min-height:calc(100dvh - var(--host-bar,0px));display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lesson-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.iconbtn:active{background:var(--surface)}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--surface-2);transition:background .4s var(--ease)}
.segs i.on{background:var(--accent)}
.lesson-body{flex:1;padding:var(--s4) var(--s4) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
.lesson-body h1{font-family:var(--font-ui);font-weight:800;font-size:22px;line-height:1.3}
.explain{display:flex;gap:var(--s3);align-items:flex-start}
.explain .bubble{font-weight:500;font-size:17px;line-height:1.6;box-shadow:none;border-radius:6px var(--r-lg) var(--r-lg) var(--r-lg)}
.scene{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-lg);background:var(--surface);font-size:16px;line-height:1.5}
.scene .ic{color:var(--accent-ink);margin-top:1px}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:58px;padding:var(--s3) var(--s4);border-radius:var(--r-md);
  background:var(--surface);border:2px solid transparent;font-size:16px;font-weight:600;line-height:1.35;transition:border-color .2s,background .2s,opacity .2s}
.opt .key{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:800}
.opt:not(:disabled):active{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 14%,var(--surface))}
.opt.right .key{background:var(--ok);color:var(--on-state)}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--surface))}
.opt.wrong .key{background:var(--bad);color:var(--on-state)}
.opt.dim{opacity:.5}
.reply{display:flex;gap:var(--s3);align-items:flex-end}
.reply .who{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.reply .bubble{box-shadow:none;font-weight:600;display:flex;gap:var(--s2);align-items:center;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.reply .mini{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);flex:0 0 auto}
.lesson-foot{position:sticky;bottom:var(--host-bar,0px);z-index:3;padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));background:var(--bg)}
.fb{border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);animation:up .45s var(--ease)}
.fb.ok{background:color-mix(in oklab,var(--ok) 16%,var(--surface))}
.fb.bad{background:color-mix(in oklab,var(--bad) 14%,var(--surface))}
.fb-head{display:flex;align-items:center;gap:var(--s2);font-weight:800;font-size:18px}
.fb.ok .fb-head{color:var(--ok)}
.fb.bad .fb-head{color:var(--bad)}
.fb p{margin:0;line-height:1.5}
.fb-row{display:flex;gap:var(--s2);align-items:center}
.fb-row .mini{width:52px;min-height:52px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;background:var(--surface);flex:0 0 auto}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s4);padding:var(--s8) var(--s4)}
.marks{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2)}
.mark{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--on-state)}
.mark.ok{background:var(--ok)}
.mark.bad{background:var(--bad)}
.finish .actions{width:100%;display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}

/* ---------- Таббар і тост ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:var(--host-bar,0px);z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px var(--s2) calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text-3);font-size:12px;font-weight:700}
.tab .pip{width:56px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:background .25s var(--ease)}
.tab.on{color:var(--text)}
.tab.on .pip{background:color-mix(in oklab,var(--accent) 22%,var(--surface));color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--host-bar,0px) + 20px);transform:translate(-50%,12px);
  max-width:calc(100% - 32px);background:var(--text);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row > .ic:first-child{color:var(--text-2)}
.stat-val{font-weight:800;font-size:17px}
.app.full{padding:0;max-width:none}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="tabbar" id="nav" hidden>
  <div class="tabbar-in">
    <button class="tab" data-action="tab" data-arg="learn"><span class="pip" data-ic="route"></span><span data-t="learn"></span></button>
    <button class="tab" data-action="tab" data-arg="cards"><span class="pip" data-ic="cards"></span><span data-t="cards"></span></button>
    <button class="tab" data-action="tab" data-arg="profile"><span class="pip" data-ic="user"></span><span data-t="profile"></span></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ================= Тексти інтерфейсу (uk / ru / en) =================
const UI={
 uk:{welcome:"Вивчайте мову для життя за кордоном",chooseUi:"Мова застосунку",chooseLang:"Яку мову вивчаєте?",chooseLangSub:"Мову можна змінити будь-коли в профілі.",

// SM-2: 0 — не знаю, 3 — важко, 5 — легко
function sm2(card,q){
  const c=card||{ef:2.5,reps:0,interval:0,due:0};
  if(q<3){ c.reps=0; c.interval=1; }
  else{ c.reps+=1; c.interval=c.reps===1?1:c.reps===2?6:Math.round(c.interval*c.ef); c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02))); }
  c.due=Date.now()+c.interval*86400000; return c;
}
function dueCards(lang){
  const now=Date.now();
  return (CARDS[lang]||[]).map(p=>({p,key:`${lang}:${p[0]}`})).filter(x=>!S.cards[x.key]||S.cards[x.key].due<=now);
}

// Рахуємо лише уроки, доступні на поточному тарифі, щоб наступний рівень не блокувався назавжди
function levelLessonCount(lang,level){ let n=0; for(let u=1;u<=UNIT_COUNT;u++) if(allowed(level,u)) for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(lang,level,u,i)) n++; return n; }
function levelDone(lang,level){ let n=0; for(let u=1;u<=UNIT_COUNT;u++) if(allowed(level,u)) for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(lang,level,u,i)&&S.passed[lessonKey(lang,level,u,i)]) n++; return n; }
function levelUnlocked(level){
  const i=LEVELS.indexOf(level); if(i<=0) return true;
  const prev=LEVELS[i-1], total=levelLessonCount(S.lang,prev);
  return levelUnlocked(prev) && total>0 && levelDone(S.lang,prev)>=total;
}
function unitStats(level,unit){
  let total=0,done=0;
  for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(S.lang,level,unit,i)){ total++; if(S.passed[lessonKey(S.lang,level,unit,i)]) done++; }
  return {total,done};
}
function canOpen(level,unit,idx){
  return levelUnlocked(level) && allowed(level,unit) && hasLesson(S.lang,level,unit,idx)
    && (idx===1 || !!S.passed[lessonKey(S.lang,level,unit,idx-1)]);
}
function allLessonsInOrder(){
  const out=[]; for(const L of LEVELS) for(let u=1;u<=UNIT_COUNT;u++) for(let i=1;i<=LESSONS_PER_UNIT;i++) out.push([L,u,i]); return out;
}
function currentLesson(){
  for(const [L,u,i] of allLessonsInOrder()) if(canOpen(L,u,i) && !S.passed[lessonKey(S.lang,L,u,i)]) return {level:L,unit:u,idx:i};
  return null;
}
function nextAfter(level,unit,idx){
  const all=allLessonsInOrder(); let seen=false;
  for(const [L,u,i] of all){ if(seen && canOpen(L,u,i)) return {level:L,unit:u,idx:i}; if(L===level&&u===unit&&i===idx) seen=true; }
  return null;
}
function touchStreak(){
  const day=new Date().toISOString().slice(0,10); if(S.lastDay===day) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=day;
}

let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(bcp){
  const pre=bcp.split("-")[0].toLowerCase();
  const score=v=>(/natural|neural|premium|enhanced|wavenet/i.test(v.name)?6:0)+(/google|microsoft/i.test(v.name)?3:0)+(v.localService===false?1:0)+(v.lang.toLowerCase()===bcp.toLowerCase()?2:0);
  return VOICES.filter(v=>v.lang.toLowerCase().startsWith(pre)).sort((a,b)=>score(b)-score(a))[0]||null;
}
function speak(text,lang,btn){
  if(!S.sound||!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const code=SPEECH[lang]||"en-GB", u=new SpeechSynthesisUtterance(text);
    u.lang=code; u.rate=0.88; u.pitch=1.02;
    const v=pickVoice(code); if(v) u.voice=v;
    if(btn){ btn.classList.add("playing"); u.onend=u.onerror=()=>btn.classList.remove("playing"); }
    speechSynthesis.speak(u);
  }catch(e){}
}

function onboardUi(){
  return `<section class="onb">
    <div class="onb-hero">${owl(120)}<div class="wordmark">Flueno</div>
      <div class="taglines"><span lang="uk">${UI.uk.welcome}</span><span lang="ru">${UI.ru.welcome}</span><span lang="en">${UI.en.welcome}</span></div></div>
    <div class="group"><h2 class="group-title">${UI.uk.chooseUi} · ${UI.ru.chooseUi} · ${UI.en.chooseUi}</h2>
      <div class="list">${["uk","ru","en"].map(c=>`<button class="row" data-action="setUi" data-arg="${c}" lang="${c}">
        <span class="code">${UI_CODES[c]}</span><span class="grow"><span class="title">${UI_NAMES[c]}</span></span>${ic("chev","chev")}</button>`).join("")}</div></div>
  </section>`;
}
function backBtn(){ return `<button class="iconbtn" data-action="back" aria-label="${T("back")}" style="margin-left:-10px">${ic("chevLeft")}</button>`; }
function pickLangView(){
  const changing=!!S.lang;
  return `<section class="stack">
    ${changing?backBtn():""}
    <div class="onb-hero" style="align-items:flex-start;text-align:left">${changing?"":owl(72)}<h1>${T("chooseLang")}</h1><p class="meta">${T("chooseLangSub")}</p></div>
    <div class="list">${LANG_ORDER.map(c=>`<button class="row ${S.lang===c?"on":""}" data-action="setLang" data-arg="${c}" aria-pressed="${S.lang===c}">
      <span class="code">${c.toUpperCase()}</span><span class="grow"><span class="title">${langName(c)}</span></span>${S.lang===c?ic("check","check"):ic("chev","chev")}</button>`).join("")}</div>
  </section>`;
}
function pickUiView(){
  return `<section class="stack">${backBtn()}<h1>${T("uiLang")}</h1>
    <div class="list">${["uk","ru","en"].map(c=>`<button class="row ${S.ui===c?"on":""}" data-action="setUi" data-arg="${c}" lang="${c}" aria-pressed="${S.ui===c}">
      <span class="code">${UI_CODES[c]}</span><span class="grow"><span class="title">${UI_NAMES[c]}</span></span>${S.ui===c?ic("check","check"):""}</button>`).join("")}</div></section>`;
}

function openUnitKey(){ if(unitShown!=="auto") return unitShown; const c=currentLesson(); return c?`${c.level}-${c.unit}`:null; }
function learnView(){
  const due=dueCards(S.lang).length, cur=currentLesson();
  const started=Object.keys(S.passed).some(k=>k.startsWith(S.lang+"-"));
  const msg=started&&due?T("msgDue"):started?T("msgGo"):T("msgStart");
  const openKey=openUnitKey(), names=unitNames();
  let h=`<div class="top">
      <button class="pill" data-action="pickLang"><span class="code">${S.lang.toUpperCase()}</span>${langName(S.lang)}${ic("chevDown","sm")}</button>
      <div class="streak ${S.streak?"":"zero"}" aria-label="${T("streak")}: ${S.streak}">${ic("flame","sm")}<span class="num">${S.streak}</span></div></div>
    <div class="greet">${owl(84)}<div class="bubble">${msg}</div></div>
    ${due?`<button class="review" data-action="review">${ic("cards")}<span class="grow">${T("reviewDue")}</span><span class="num">${due}</span>${ic("chev","sm")}</button>`:""}`;
  LEVELS.forEach((L,li)=>{
    const unlocked=levelUnlocked(L), total=levelLessonCount(S.lang,L), dn=levelDone(S.lang,L), finished=total>0&&dn>=total;
    h+=`<section class="level ${unlocked?"":"locked"}" style="--lv:var(--lv-${L})"><div class="level-head">
      <span class="lv-badge">${L}</span><div class="grow"><h2>${lvName(L)}</h2>
      ${unlocked?(total?`<p class="meta num">${T("lessonsCount",{d:dn,t:total})}</p><div class="lvbar"><i style="width:${Math.round(dn/total*100)}%"></i></div>`:`<p class="meta">${T("soon")}</p>`)
        :`<p class="meta">${T("levelLocked",{lv:LEVELS[li-1]})}</p>`}
      </div><span class="state">${unlocked?(finished?ic("checkCircle"):""):ic("lock")}</span></div>`;
    if(unlocked){
      h+=`<ol class="route">`;
      names.forEach((title,ui)=>{
        const u=ui+1, isOpen=allowed(L,u), st=unitStats(L,u), avail=st.total>0, key=`${L}-${u}`;
        const done=isOpen&&avail&&st.done>=st.total, expanded=isOpen&&avail&&openKey===key;
        const cls=[(!isOpen||!avail)?"closed":"", done?"done":"", (!done&&st.done>0)?"started":"", expanded?"open":""].join(" ");
        const meta=!isOpen?`${ic("lock","xs")}${T("plusOnly")}`:!avail?T("soon"):T("lessonsCount",{d:st.done,t:st.total});
        const action=isOpen&&avail?`data-action="unit" data-arg="${key}" aria-expanded="${expanded}"`:!isOpen?`data-action="plusOnly"`:`data-action="soon"`;
        h+=`<li class="stop ${cls}"><button class="stop-btn" ${action}>
            <span class="dot">${done?ic("check","xs"):u}</span>
            <span class="stop-text"><span class="stop-title">${esc(title)}</span><span class="stop-meta num">${meta}</span></span>
            ${isOpen&&avail?ic("chev","chev"):""}</button>`;
        if(expanded) h+=unitPanel(L,u,cur);
        h+=`</li>`;
      });
      h+=`</ol>`;
    }
    h+=`</section>`;
  });
  h+=`<p class="plusnote">${ic("crown","sm")}<span>${T("plusNote")}</span></p>`;
  return h;
}
function unitPanel(L,u,cur){
  let nextIdx=null;
  const stops=[1,2,3,4].map(i=>{
    const k=lessonKey(S.lang,L,u,i), has=hasLesson(S.lang,L,u,i), done=!!S.passed[k], ok=canOpen(L,u,i);
    const isCur=cur&&cur.level===L&&cur.unit===u&&cur.idx===i;
    if(nextIdx===null&&ok&&!done) nextIdx=i;
    const cls=done?"done":isCur?"cur":(!ok?"locked":"");
    const label=has?esc(lessonBody(k).title):"";
    return `<button class="les ${cls}" data-action="lesson" data-arg="${L}|${u}|${i}" aria-label="${label}" ${has?"":"disabled"}>${done?ic("check","sm"):i}</button>`;
  }).join("");
  const next=nextIdx?`<div class="upnext"><p class="meta">${T("upNext",{title:`<b>${esc(lessonBody(lessonKey(S.lang,L,u,nextIdx)).title)}</b>`})}</p>
      <button class="btn" data-action="lesson" data-arg="${L}|${u}|${nextIdx}">${T("startLesson")}${ic("arrowRight","sm")}</button></div>`
    :`<p class="meta">${T("unitDone")}</p>`;
  return `<div class="unit-panel"><div class="stops">${stops}</div>${next}</div>`;
}

function intervalLabel(q){
  const key=S.lang+":"+deck[0][0], base=S.cards[key]?JSON.parse(JSON.stringify(S.cards[key])):null;
  return T("days",{n:sm2(base,q).interval});
}
function cardActions(){
  if(!flipped) return `<p class="hint">${T("tapFlip")}</p><button class="btn" data-action="flip">${T("showAnswer")}</button>`;
  return `<div class="rate">
    <button class="r0" data-action="rate" data-arg="0">${T("dontKnow")}<small>${T("now")}</small></button>
    <button class="r3" data-action="rate" data-arg="3">${T("hard")}<small class="num">${intervalLabel(3)}</small></button>
    <button class="r5" data-action="rate" data-arg="5">${T("easy")}<small class="num">${intervalLabel(5)}</small></button></div>`;
}
function cardsView(){
  if(deckLang!==S.lang){ deck=[]; deckLang=S.lang; }
  if(!deck.length){ deck=dueCards(S.lang).map(x=>x.p); flipped=false; }
  if(!deck.length) return `<div class="screen-head"><h1>${T("cards")}</h1></div>
    <div class="empty">${owl(110,"happy")}<h2>${T("deckDone")}</h2><p class="meta">${T("deckDoneSub")}</p>
    <button class="btn quiet" data-action="tab" data-arg="learn" style="max-width:280px">${T("toRoute")}</button></div>`;
  const card=deck[0], front=card[0], back=backFor(S.lang,card);
  return `<div class="screen-head"><h1>${T("cards")}</h1><span class="meta num">${T("cardsLeft",{n:deck.length})}</span></div>
    <div class="flash-wrap">
      <button class="flash ${flipped?"turned":""}" id="flash" data-action="flip" aria-label="${T("showAnswer")}">
        <span class="face front"><span class="code corner">${S.lang.toUpperCase()}</span><span class="word" lang="${S.lang}">${esc(front)}</span></span>
        <span class="face back"><span class="code corner">${UI_CODES[S.ui]}</span><span class="word">${esc(back)}</span><span class="small" lang="${S.lang}">${esc(front)}</span></span>
      </button>
      <button class="speak" data-action="listenCard" aria-label="${T("listen")}">${ic("volume")}</button>
    </div>
    <div id="cardActions">${cardActions()}</div>`;
}
function flipCard(){
  flipped=!flipped;
  const f=document.getElementById("flash"), a=document.getElementById("cardActions");
  if(f) f.classList.toggle("turned",flipped);
  if(a) a.innerHTML=cardActions();
}
function rateCard(q){
  if(!deck.length) return;
  const key=S.lang+":"+deck[0][0];
  S.cards[key]=sm2(S.cards[key],q); touchStreak(); save();
  if(q===0){ deck.push(deck.shift()); haptic("warning"); } else { deck.shift(); haptic("success"); }
  flipped=false; render();
}

function profileView(){
  const learned=Object.keys(S.cards).filter(k=>k.startsWith(S.lang+":")&&S.cards[k].reps>=1).length;
  const lessonsDone=Object.keys(S.passed).filter(k=>k.startsWith(S.lang+"-")).length;
  const stat=(label,val)=>`<div class="row"><span class="grow"><span class="title">${label}</span></span><span class="stat-val num">${val}</span></div>`;
  return `<div class="screen-head"><h1>${T("profile")}</h1></div>
  <div class="stack">
    <div class="group"><h2 class="group-title">${T("progress")} · ${langName(S.lang)}</h2><div class="list">
      ${stat(T("learned"),learned)}${stat(T("lessonsDone"),lessonsDone)}${stat(T("streak"),S.streak)}</div></div>
    <div class="group"><h2 class="group-title">${T("settings")}</h2><div class="list">
      <button class="row" data-action="pickUi">${ic("globe")}<span class="grow"><span class="title">${T("uiLang")}</span></span><span class="value">${UI_NAMES[S.ui]}</span>${ic("chev","chev")}</button>
      <button class="row" data-action="pickLang">${ic("book")}<span class="grow"><span class="title">${T("learnLang")}</span></span><span class="value">${langName(S.lang)}</span>${ic("chev","chev")}</button>
      <button class="row" data-action="toggleSound" role="switch" aria-checked="${S.sound}">${ic("volume")}<span class="grow"><span class="title">${T("sound")}</span></span><span class="switch ${S.sound?"on":""}"></span></button>
      <div class="row">${ic("crown")}<span class="grow"><span class="title">${T("plan")}: ${T("free")}</span><span class="sub">${T("plusNote")}</span></span></div>
    </div></div>
    <div class="list"><button class="row danger" data-action="reset">${T("reset")}</button></div>
  </div>`;
}

// ================= Урок =================
function startLesson(L,u,i){
  const key=lessonKey(S.lang,L,u,i), body=lessonBody(key);
  if(!body) return toast(T("soon"));
  session={key,level:L,unit:u,idx:i,body,step:0,chosen:null,ok:null,correct:0,total:0,orders:{},results:[],finished:false,passed:false};
  view="lesson"; render(); window.scrollTo(0,0);
}
function orderFor(step){
  const s=session;
  if(!s.orders[s.step]){ const a=step.options.map((_,i)=>i); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } s.orders[s.step]=a; }
  return s.orders[s.step];
}
function correctOrig(step){ return step.type==="quiz"?step.answer:step.options.findIndex(o=>o.ok); }
function lessonView(){
  const s=session, b=s.body, steps=b.steps;
  if(s.finished) return finishView();
  const step=steps[s.step];
  const segs=steps.map((_,i)=>`<i class="${(i<s.step||(i===s.step&&s.chosen!==null))?"on":""}"></i>`).join("");
  let body="", foot="";
  if(step.type==="explain"){
    body=`${s.step===0?`<div><h1>${esc(b.title)}</h1><p class="meta" style="margin-top:6px">${esc(b.goal)}</p></div>`:`<h1>${T("explain")}</h1>`}
      <div class="explain">${owl(56)}<div class="bubble">${esc(step.text)}</div></div>`;
    foot=`<button class="btn" data-action="cont">${T("cont")}</button>`;
  } else {
    const order=orderFor(step), right=correctOrig(step);
    const texts=step.type==="quiz"?step.options:step.options.map(o=>o.text);
    const opts=order.map((orig,d)=>{
      let cls="";
      if(s.chosen!==null){ cls= orig===right?"right": d===s.chosen?"wrong":"dim"; }
      const t=texts[orig];
      return `<button class="opt ${cls}" data-action="answer" data-arg="${d}" ${s.chosen!==null?"disabled":""} ${hasCyr(t)?"":`lang="${S.lang}"`}>
        <span class="key">${"ABCD"[d]}</span><span>${esc(t)}</span></button>`;
    }).join("");
    if(step.type==="quiz") body=`<h1>${esc(step.question)}</h1><div class="opts">${opts}</div>`;
    else{
      body=`<h1>${T("situation")}</h1><div class="scene">${ic("chat")}<span>${esc(step.scene)}</span></div><div class="opts">${opts}</div>`;
      if(s.chosen!==null&&s.ok){
        const reply=step.options[order[s.chosen]].reply;
        body+=`<div class="reply"><span class="who">${ic("user","sm")}</span><div class="bubble"><span lang="${S.lang}">${esc(reply)}</span>
          <button class="mini" data-action="listenReply" aria-label="${T("listen")}">${ic("volume","sm")}</button></div></div>`;
      }
    }
    if(s.chosen===null) foot=`<p class="meta" style="text-align:center">${T("pick")}</p>`;
    else{
      const ok=s.ok;
      let note="";
      if(step.type==="quiz") note=step.explain;
      else if(!ok) note=step.options[order[s.chosen]].reply;
      const rightText=texts[right], canListen=!step.optionsLocalized&&!hasCyr(rightText)&&step.type==="quiz";
      foot=`<div class="fb ${ok?"ok":"bad"}"><div class="fb-head">${ic(ok?"checkCircle":"xCircle")}${ok?T("correct"):T("wrong")}</div>
        ${note?`<p>${esc(note)}</p>`:""}
        <div class="fb-row">${canListen?`<button class="mini" data-action="listenAnswer" aria-label="${T("listen")}">${ic("volume")}</button>`:""}
        <button class="btn ${ok?"ok":"bad"}" data-action="cont">${T("cont")}</button></div></div>`;
    }
  }
  return `<div class="lesson">
    <div class="lesson-top"><button class="iconbtn" data-action="closeLesson" aria-label="${T("close")}">${ic("close")}</button>
      <div class="segs" aria-hidden="true">${segs}</div><span class="code">${s.level}</span></div>
    <div class="lesson-body">${body}</div>
    <div class="lesson-foot">${foot}</div></div>`;
}
function finishView(){
  const s=session, next=s.passed?nextAfter(s.level,s.unit,s.idx):null;
  return `<div class="lesson"><div class="lesson-top"><button class="iconbtn" data-action="closeLesson" aria-label="${T("close")}">${ic("close")}</button>
      <div class="segs" aria-hidden="true">${s.body.steps.map(()=>`<i class="on"></i>`).join("")}</div><span class="code">${s.level}</span></div>
    <div class="finish">${owl(130,s.passed?"happy":"",s.passed?"cheer":"")}
      <h1>${s.passed?T("lessonDone"):T("lessonRetry")}</h1><p class="meta">${esc(s.body.title)}</p>
      ${s.results.length?`<div class="marks" aria-hidden="true">${s.results.map(r=>`<span class="mark ${r?"ok":"bad"}">${ic(r?"check":"close","xs")}</span>`).join("")}</div>`:""}
      <p class="meta num">${T("scoreLine",{c:s.correct,t:s.total})}</p>
      <div class="actions">
        ${next?`<button class="btn" data-action="nextLesson">${T("nextLesson")}${ic("arrowRight","sm")}</button>`:""}
        ${!s.passed?`<button class="btn" data-action="retry">${T("retry")}</button>`:""}
        <button class="btn quiet" data-action="closeLesson">${T("toRoute")}</button>
      </div></div></div>`;
}
function answer(d){
  const s=session; if(!s||s.chosen!==null) return;
  const step=s.body.steps[s.step], orig=orderFor(step)[d];
  s.chosen=d; s.ok=orig===correctOrig(step); s.total++; if(s.ok) s.correct++; s.results.push(s.ok);
  haptic(s.ok?"success":"error"); render();
}
function cont(){
  const s=session; if(!s) return;
  const step=s.body.steps[s.step];
  if(step.type!=="explain"&&s.chosen===null) return;
  s.step++; s.chosen=null; s.ok=null;
  if(s.step>=s.body.steps.length){
    s.finished=true; s.passed=s.total===0||s.correct>=s.total*0.5;
    if(s.passed){
      const wasDone=levelDone(S.lang,s.level)>=levelLessonCount(S.lang,s.level);
      S.passed[s.key]=true; haptic("success");
      const nowDone=levelDone(S.lang,s.level)>=levelLessonCount(S.lang,s.level);
      if(!wasDone&&nowDone&&LEVELS.indexOf(s.level)<LEVELS.length-1) setTimeout(()=>toast(T("msgLevel")),600);
    } else haptic("error");
    touchStreak(); save();
  }
  render(); window.scrollTo(0,0);
}
function closeLesson(){ session=null; view="home"; tab="learn"; unitShown="auto"; render(); window.scrollTo(0,0); }
function goBack(){ if(view==="lesson") return closeLesson(); if(view==="pickUi"||view==="pickLang"){ view="home"; render(); } }
function confirmReset(){
  const doReset=()=>{ S={...defaults,ui:S.ui,lang:S.lang,sound:S.sound}; save(); deck=[]; unitShown="auto"; render(); toast(T("resetOk")); };
  try{ if(inTg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")) return tg.showConfirm(T("resetQ"),ok=>{ if(ok) doReset(); }); }catch(e){}
  try{ if(window.confirm(T("resetQ"))) doReset(); }catch(e){}
}

// ================= Події =================
document.addEventListener("click",(e)=>{
  const el=e.target.closest("[data-action]"); if(!el||el.disabled) return;
  const a=el.dataset.action, arg=el.dataset.arg;
  switch(a){
    case "setUi": S.ui=arg; save(); if(view==="pickUi"){ view="home"; tab="profile"; } return render();
    case "setLang": S.lang=arg; save(); view="home"; tab="learn"; deck=[]; unitShown="auto"; render(); return window.scrollTo(0,0);
    case "tab": tab=arg; view="home"; deck=[]; flipped=false; render(); return window.scrollTo(0,0);
    case "pickLang": view="pickLang"; render(); return window.scrollTo(0,0);
    case "pickUi": view="pickUi"; render(); return window.scrollTo(0,0);
    case "back": return goBack();
    case "unit": unitShown= openUnitKey()===arg?null:arg; return render();
    case "plusOnly": return toast(T("plusOnly"));
    case "soon": return toast(T("soon"));
    case "lesson": { const [L,u,i]=arg.split("|"); if(!levelUnlocked(L)) return toast(T("levelLocked",{lv:LEVELS[LEVELS.indexOf(L)-1]}));
      if(!canOpen(L,+u,+i)) return toast(T("lockedLesson")); return startLesson(L,+u,+i); }
    case "review": tab="cards"; deck=[]; flipped=false; render(); return window.scrollTo(0,0);
    case "flip": return flipCard();
    case "listenCard": return deck.length&&speak(deck[0][0],S.lang,el);
    case "rate": return rateCard(+arg);
    case "answer": return answer(+arg);
    case "cont": return cont();
    case "listenAnswer": { const st=session.body.steps[session.step-0]; return speak(st.options[st.answer],S.lang,el); }
    case "listenReply": { const st=session.body.steps[session.step], o=orderFor(st)[session.chosen]; return speak(st.options[o].reply,S.lang,el); }
    case "closeLesson": return closeLesson();
    case "retry": return startLesson(session.level,session.unit,session.idx);
    case "nextLesson": { const n=nextAfter(session.level,session.unit,session.idx); return n?startLesson(n.level,n.unit,n.idx):closeLesson(); }
    case "toggleSound": S.sound=!S.sound; save(); try{ if(!S.sound) speechSynthesis.cancel(); }catch(err){} return render();
    case "reset": return confirmReset();
  }
});
// Хостинг може додати свою закріплену смужку внизу. Не ховаємо її, а піднімаємо свої нижні елементи над нею.
function measureHostBar(){
  let h=0;
  for(const el of document.body.children){
    if(el.id==="app"||el.id==="nav"||el.id==="toast"||el.tagName==="SCRIPT") continue;
    const cs=getComputedStyle(el);
    if(cs.position==="fixed"&&cs.display!=="none"&&cs.visibility!=="hidden"){
      const r=el.getBoundingClientRect();
      if(r.height>0&&r.height<160&&Math.abs(r.bottom-window.innerHeight)<2) h=Math.max(h,Math.round(r.height));
    }
  }
  document.documentElement.style.setProperty("--host-bar",h+"px");
}
try{ new MutationObserver(measureHostBar).observe(document.body,{childList:true}); }catch(e){}
window.addEventListener("resize",measureHostBar);
[300,1200,3000].forEach(t=>setTimeout(measureHostBar,t));
applyTheme();
render();
measureHostBar();
</script>
