<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Flueno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Токени ---------- */
:root{
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);
  --tabbar-h:64px;
}
[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2C; --surface-2:#1E2538; --line:#2A3247;
  --text:#EEF1F8; --text-2:#A9B1C7; --text-3:#7C849C;
  --accent:#FFD24A; --accent-ink:#FFD24A; --on-accent:#1A1505;
  --ok:#5FD6A4; --bad:#FF7A6B; --warn:#FFB547; --on-state:#0E1220;
  --lv-A1:#FFD24A; --lv-A2:#5FD6A4; --lv-B1:#6CB8FF; --lv-B2:#B18CFF; --lv-C1:#FF8A7A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#F6F3EA; --surface:#FFFFFF; --surface-2:#EFEBE0; --line:#E0DACB;
  --text:#161A2B; --text-2:#5A6078; --text-3:#7E8399;
  --accent:#F5C21B; --accent-ink:#8A6400; --on-accent:#1A1505;
  --ok:#12805A; --bad:#C8402F; --warn:#B86E00; --on-state:#FFFFFF;
  --lv-A1:#D9A200; --lv-A2:#19A06F; --lv-B1:#2F7FD9; --lv-B2:#7A55D6; --lv-C1:#D9573F;
  --shadow:0 10px 28px -14px rgba(40,30,10,.35), 0 2px 6px -2px rgba(40,30,10,.12);
}

/* ---------- База ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 0;caret-color:var(--accent-ink);
  scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:var(--on-accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:var(--r-sm)}
.app{max-width:560px;margin:0 auto;padding:var(--s4) var(--s4) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--host-bar,0px) + var(--s8))}
.app.full{padding-bottom:0}
.ic{width:24px;height:24px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.ic.xs{width:14px;height:14px;stroke-width:2.4}

h1,.h1{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2,.h2{font-weight:800;font-size:18px;line-height:1.3;margin:0;text-wrap:balance}
.meta{color:var(--text-2);font-size:14px;line-height:1.4;margin:0}
.muted{color:var(--text-3)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:52px;padding:0 var(--s5);
  border-radius:var(--r-md);font-weight:800;font-size:16px;background:var(--accent);color:var(--on-accent);
  transition:transform .18s var(--ease),filter .18s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn.ok{background:var(--ok);color:var(--on-state)}
.btn.bad{background:var(--bad);color:var(--on-state)}
.btn.quiet{background:var(--surface-2);color:var(--text)}
.link{color:var(--accent-ink);font-weight:700}

/* ---------- Маскот ---------- */
.mascot{display:block;flex:0 0 auto}
.mascot .ear-flick{transform-box:fill-box;transform-origin:center bottom;animation:earWiggle 4s ease-in-out infinite}
@keyframes earWiggle{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(6deg)}95%{transform:rotate(-4deg)}}
.mascot .tail-wag{transform-box:fill-box;transform-origin:left center;animation:tailWag 2.5s ease-in-out infinite}
@keyframes tailWag{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-8deg)}}
.mascot.cheer{animation:hop .9s var(--ease) 2}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.mascot .blink-lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}

/* ---------- Сердца / Game Over ---------- */
.hearts-bar{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--bad)}
.hearts-bar svg{width:18px;height:18px}
.hearts-bar .empty{opacity:.25}
.game-over-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.game-over-card{background:var(--bg);border-radius:24px;padding:32px 24px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;animation:slideUp .4s var(--ease)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.game-over-card h2{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.game-over-card .meta{color:var(--text-2);font-size:14px;line-height:1.5}
.game-over-card .actions{display:flex;flex-direction:column;gap:10px;width:100%}
.hearts-big{display:flex;gap:6px;justify-content:center}
.hearts-big svg{width:32px;height:32px;color:var(--bad)}

/* ---------- Онбординг ---------- */
.onb{display:flex;flex-direction:column;gap:var(--s6);padding-top:var(--s6)}
.onb-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1}
.wordmark span{color:var(--accent-ink)}
.taglines{display:flex;flex-direction:column;gap:2px;color:var(--text-2);font-size:14px}

/* ---------- Списки-рядки ---------- */
.group{display:flex;flex-direction:column;gap:var(--s2)}
.group-title{font-size:14px;font-weight:700;color:var(--text-2);margin:0 0 var(--s1) var(--s1)}
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:var(--s3) var(--s4);text-align:left}
.list .row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:700;display:block}
.row .sub{display:block;color:var(--text-2);font-size:14px}
.row .value{color:var(--text-2);font-size:15px}
.row .chev{color:var(--text-3)}
.row.on .check{color:var(--accent-ink)}
.row.danger{color:var(--bad);justify-content:center;font-weight:700}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:28px;padding:0 6px;border-radius:8px;
  background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--text)}
.row.on .code{background:var(--accent);color:var(--on-accent)}

/* ---------- Шапка вкладки ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s3) 0 var(--s1);border-radius:999px;background:var(--surface);font-weight:700}
.pill .code{height:32px;border-radius:999px;min-width:40px}
.streak{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 var(--s3);border-radius:999px;background:var(--surface);font-weight:800}
.streak .ic{color:var(--warn)}
.streak.zero .ic{color:var(--text-3)}

/* ---------- Привітання сови ---------- */
.greet{display:flex;align-items:flex-end;gap:var(--s3);margin-bottom:var(--s5)}
.bubble{position:relative;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px;padding:var(--s3) var(--s4);font-weight:700;line-height:1.4;box-shadow:var(--shadow)}
.review{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);margin-bottom:var(--s6);border-radius:var(--r-lg);
  background:color-mix(in oklab,var(--accent) 16%,var(--surface));color:var(--text);font-weight:700}
.review .ic{color:var(--accent-ink)}
.review .grow{flex:1}

/* ---------- Маршрут рівнів ---------- */
.level{--lv:var(--lv-A1);margin-bottom:var(--s8)}
.level-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.lv-badge{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;flex:0 0 auto;
  background:var(--lv);color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:16px}
.level.locked .lv-badge{background:var(--surface-2);color:var(--text-3)}
.level-head .grow{flex:1;min-width:0}
.level-head .state{color:var(--lv)}
.level.locked .level-head .state{color:var(--text-3)}
.lvbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.lvbar i{display:block;height:100%;border-radius:99px;background:var(--lv);transition:width .8s var(--ease)}

.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line);border-radius:2px}
.stop{position:relative}
.stop-btn{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s2) 0;text-align:left}
.dot{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:var(--bg);border:2px solid var(--line);color:var(--text-3);font-weight:800;font-size:15px}
.stop.started .dot{border-color:var(--lv);color:var(--lv)}
.stop.done .dot{background:var(--lv);border-color:var(--lv);color:var(--on-accent)}
.stop.closed .dot{border-style:dashed}
.stop-text{flex:1;min-width:0;padding:var(--s2) 0}
.stop-title{display:block;font-weight:700}
.stop.closed .stop-title{color:var(--text-2)}
.stop-meta{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px}
.stop .chev{color:var(--text-3);transition:transform .25s var(--ease)}
.stop.open .chev{transform:rotate(90deg)}

.unit-panel{margin:var(--s1) 0 var(--s3) 56px;padding:var(--s4);background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:var(--s4)}
.stops{display:flex;gap:var(--s3)}
.les{flex:1;aspect-ratio:1;max-width:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text-3);font-weight:800;font-size:16px;position:relative}
.les.done{background:var(--lv);color:var(--on-accent)}
.les.cur{background:var(--accent);color:var(--on-accent)}
.les.cur::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);opacity:.6;animation:ring 1.8s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.les.locked{opacity:.55}
.upnext{display:flex;flex-direction:column;gap:var(--s3)}
.upnext .meta b{color:var(--text)}
.plusnote{display:flex;align-items:center;gap:var(--s2);color:var(--text-2);font-size:14px;margin-top:var(--s2)}
.plusnote .ic{color:var(--accent-ink)}

/* ---------- Картки ---------- */
.screen-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5)}
.flash-wrap{position:relative;perspective:1400px;margin-bottom:var(--s4)}
.flash{display:block;width:100%;height:300px;position:relative;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.flash.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s8) var(--s6);text-align:center;
  background:var(--surface);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
.face .word{font-weight:800;font-size:30px;line-height:1.2;text-wrap:balance}
.face .small{color:var(--text-2);font-size:15px}
.face .corner{position:absolute;top:var(--s4);left:var(--s4)}
.speak{position:absolute;top:var(--s3);right:var(--s3);z-index:2;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--text)}
.speak.playing{color:var(--accent-ink)}
.speak.playing .ic{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.hint{text-align:center;color:var(--text-3);font-size:14px;margin:0 0 var(--s4)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center;border-radius:var(--r-md);font-weight:800}
.rate .r0{background:color-mix(in oklab,var(--bad) 18%,var(--surface));color:var(--bad)}
.rate .r3{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}
.rate .r5{background:color-mix(in oklab,var(--ok) 18%,var(--surface));color:var(--ok)}
.rate small{font-weight:600;font-size:12px;opacity:.85}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s10) var(--s4)}

/* ---------- Профіль ---------- */
.stack{display:flex;flex-direction:column;gap:var(--s6)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--surface-2);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text-2);transition:transform .25s var(--ease),background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px);background:var(--on-accent)}

/* ---------- Урок ---------- */
.lesson{min-height:calc(100dvh - var(--host-bar,0px));display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lesson-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.iconbtn:active{background:var(--surface)}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--surface-2);transition:background .4s var(--ease)}
.segs i.on{background:var(--accent)}
.lesson-body{flex:1;padding:var(--s4) var(--s4) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
.lesson-body h1{font-family:var(--font-ui);font-weight:800;font-size:22px;line-height:1.3}
.explain{display:flex;gap:var(--s3);align-items:flex-start}
.explain .bubble{font-weight:500;font-size:17px;line-height:1.6;box-shadow:none;border-radius:6px var(--r-lg) var(--r-lg) var(--r-lg)}
.scene{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-lg);background:var(--surface);font-size:16px;line-height:1.5}
.scene .ic{color:var(--accent-ink);margin-top:1px}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:58px;padding:var(--s3) var(--s4);border-radius:var(--r-md);
  background:var(--surface);border:2px solid transparent;font-size:16px;font-weight:600;line-height:1.35;transition:border-color .2s,background .2s,opacity .2s}
.opt .key{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:800}
.opt:not(:disabled):active{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 14%,var(--surface))}
.opt.right .key{background:var(--ok);color:var(--on-state)}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--surface))}
.opt.wrong .key{background:var(--bad);color:var(--on-state)}
.opt.dim{opacity:.5}
.reply{display:flex;gap:var(--s3);align-items:flex-end}
.reply .who{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.reply .bubble{box-shadow:none;font-weight:600;display:flex;gap:var(--s2);align-items:center;border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px}
.reply .mini{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);flex:0 0 auto}
.lesson-foot{position:sticky;bottom:var(--host-bar,0px);z-index:3;padding:var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));background:var(--bg)}
.fb{border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);animation:up .45s var(--ease)}
.fb.ok{background:color-mix(in oklab,var(--ok) 16%,var(--surface))}
.fb.bad{background:color-mix(in oklab,var(--bad) 14%,var(--surface))}
.fb-head{display:flex;align-items:center;gap:var(--s2);font-weight:800;font-size:18px}
.fb.ok .fb-head{color:var(--ok)}
.fb.bad .fb-head{color:var(--bad)}
.fb p{margin:0;line-height:1.5}
.fb-row{display:flex;gap:var(--s2);align-items:center}
.fb-row .mini{width:52px;min-height:52px;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;background:var(--surface);flex:0 0 auto}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s4);padding:var(--s8) var(--s4)}
.marks{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2)}
.mark{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--on-state)}
.mark.ok{background:var(--ok)}
.mark.bad{background:var(--bad)}
.finish .actions{width:100%;display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}

/* ---------- Таббар і тост ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:var(--host-bar,0px);z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px var(--s2) calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text-3);font-size:12px;font-weight:700}
.tab .pip{width:56px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:background .25s var(--ease)}
.tab.on{color:var(--text)}
.tab.on .pip{background:color-mix(in oklab,var(--accent) 22%,var(--surface));color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--host-bar,0px) + 20px);transform:translate(-50%,12px);
  max-width:calc(100% - 32px);background:var(--text);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);z-index:9;text-align:center}

// Plan: stored in localStorage, can be upgraded via Telegram Stars
let PLAN=(()=>{
  try{
    // URL param overrides (for bot links)
    const p=new URLSearchParams(location.search).get("plan");
    if(["plus","pro"].includes(p)){ localStorage.setItem("flueno-plan",p); return p; }
    return localStorage.getItem("flueno-plan")||"free";
  }catch(e){ return "free"; }
})();
function setPlan(p){ PLAN=p; try{ localStorage.setItem("flueno-plan",p); }catch(e){} }

// Telegram Stars pricing (1 Star ≈ $0.013)
const PRICES={
  plus:{ stars:249, monthly:49, label:"Plus" },   // ~$3.24 one-time, or ~$0.64/mo
  pro:{ stars:499, monthly:99, label:"Pro" }       // ~$6.49 one-time, or ~$1.29/mo
};
// Subscription check
function checkSubscription(){
  try{
    const sub=JSON.parse(localStorage.getItem("flueno-sub")||"null");
    if(!sub) return;
    if(sub.type==="lifetime"){ setPlan(sub.plan); return; }
    if(sub.type==="monthly"&&sub.until&&new Date(sub.until)>new Date()){ setPlan(sub.plan); return; }
    // expired monthly
    if(sub.type==="monthly"&&sub.until&&new Date(sub.until)<=new Date()){ setPlan("free"); }
  }catch(e){}
}
checkSubscription();

  return {title:tr.title||b.title, goal:tr.goal||b.goal, steps:b.steps.map((st,i)=>{

  })};
}

const KEY="flueno-v2";
const defaults={ui:null,lang:null,level:"A1",passed:{},cards:{},streak:0,lastDay:null,sound:true,voices:{}};
let S=load();
function load(){ try{ const s=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||"{}")); s.voices=s.voices||{}; return s; }catch(e){ return {...defaults,voices:{}}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function T(k,v){ let s=(UI[S.ui]||UI.uk)[k]; if(s==null) s=UI.uk[k]; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; }
function lvName(l){ return (UI[S.ui]||UI.uk).levels[l]; }
function langName(c){ return (LANG_NAMES[c]||{})[S.ui]||LANG_NAMES[c].uk; }
function unitNames(level){ const u=UNIT_NAMES[level]||UNIT_NAMES.A1; return u[S.ui]||u.uk; }
function uiIdx(){ return {uk:0,ru:1,en:2}[S.ui]||0; }
function lessonKey(lang,level,unit,idx){ return `${lang}-${level}-${unit}-${idx}`; }
function planName(){ return T({free:"planFree",plus:"planPlus",pro:"planPro"}[PLAN]); }
// Тарифи як у боті: безкоштовно — A1 розділи 1–2, Plus — A1–B1, Pro — усі рівні
function allowed(level,unit){
  if(PLAN==="pro") return true;
  if(PLAN==="plus") return ["A1","A2","B1"].includes(level);
  return level==="A1"&&unit<=2;
}

// ---- Уроки: ручні, фразові, тематичні (словник) і повторення ----
function vocabLesson(level,unit,idx){ const l=VOCAB[level]; return (l&&l[unit]&&l[unit][idx-1])||null; }
function wordOf(row,lang){ return row[VOCAB_COL[lang]]; }
function hasContent(lang,level,unit,idx){ return !!(staticHasLesson(lang,level,unit,idx)||vocabLesson(level,unit,idx)); }
function hasLesson(lang,level,unit,idx){
  if(idx===LESSONS_PER_UNIT){ for(let i=1;i<LESSONS_PER_UNIT;i++) if(hasContent(lang,level,unit,i)) return true; return false; }
  return hasContent(lang,level,unit,idx);
}
function lessonTitle(lang,level,unit,idx){
  if(idx===LESSONS_PER_UNIT) return T("review");
  const k=lessonKey(lang,level,unit,idx);
  if(staticHasLesson(lang,level,unit,idx)) return staticLessonBody(k).title;
  const v=vocabLesson(level,unit,idx); return v?v.t[uiIdx()]:"";
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickDistractors(correct,pool,n){
  const out=[], seen=new Set([correct]);
  for(const x of shuffle(pool)){ if(!seen.has(x)){ seen.add(x); out.push(x); } if(out.length>=n) break; }
  return out;
}
function unitWords(level,unit){
  const rows=[]; for(let i=1;i<LESSONS_PER_UNIT;i++){ const v=vocabLesson(level,unit,i); if(v&&!staticHasLesson(S.lang,level,unit,i)) rows.push(...v.w); }
  return rows;
}
function wordQuizzes(rows,poolRows,withListen){
  const lang=S.lang, ui=uiIdx(), steps=[];
  const poolW=poolRows.map(r=>wordOf(r,lang)), poolG=poolRows.map(r=>r[ui]);
  rows.forEach((r,k)=>{
    const w=wordOf(r,lang), g=r[ui];
    if(k%2===0) steps.push({type:"quiz",question:T("qMeaning",{w}),options:[g,...pickDistractors(g,poolG,3)],answer:0,explain:`${w} — ${g}`,uiOpts:true,say:w});
    else steps.push({type:"quiz",question:T("qSay",{g}),options:[w,...pickDistractors(w,poolW,3)],answer:0,explain:`${w} — ${g}`,say:w});
  });
  if(withListen){
    shuffle(rows.filter(r=>canSayWord(wordOf(r,lang),lang))).slice(0,2).forEach(r=>{ const w=wordOf(r,lang), g=r[ui];
      steps.push({type:"quiz",listen:true,question:T("qListen"),options:[w,...pickDistractors(w,poolW,3)],answer:0,explain:`${w} — ${g}`,say:w}); });
  }
  return steps;
}
function buildVocabBody(level,unit,idx){
  const v=vocabLesson(level,unit,idx), ui=uiIdx();
  const pool=unitWords(level,unit).length>=8?unitWords(level,unit):v.w;
  const items=v.w.map(r=>({w:wordOf(r,S.lang),g:r[ui]}));
  return {title:v.t[ui],goal:T("vocabGoal",{n:items.length}),kind:"vocab",rows:v.w,
    steps:[{type:"words",items},...wordQuizzes(v.w,pool,canVoice(S.lang))]};
}
function buildReviewBody(level,unit){
  const rows=unitWords(level,unit), steps=[];
  if(rows.length){
    // Спершу слова, які ви знаєте найгірше або ще не повторювали
    const score=r=>{ const c=S.cards[S.lang+":"+wordOf(r,S.lang)]; return c?(c.ef||2.5)+(c.reps||0)*0.3:0; };
    const pick=shuffle(rows).sort((a,b)=>score(a)-score(b)).slice(0,8);
    steps.push(...wordQuizzes(pick,rows,canVoice(S.lang)));
  }
  // Питання з уроків фраз цього розділу
  for(let i=1;i<LESSONS_PER_UNIT;i++) if(staticHasLesson(S.lang,level,unit,i)){
    const b=staticLessonBody(lessonKey(S.lang,level,unit,i));
    steps.push(...b.steps.filter(s=>s.type!=="explain"));
  }
  return {title:T("review"),goal:T("reviewGoal"),kind:"review",steps:shuffle(steps).slice(0,10)};
}
function lessonBody(key){
  const [lang,level,u,i]=key.split("-"), unit=+u, idx=+i;
  if(idx===LESSONS_PER_UNIT) return hasLesson(lang,level,unit,idx)?buildReviewBody(level,unit):null;
  if(staticHasLesson(lang,level,unit,idx)) return staticLessonBody(key);
  if(vocabLesson(level,unit,idx)) return buildVocabBody(level,unit,idx);
  return null;
}

// ---- Картки: базові фрази + слова з пройдених уроків, повторення за SM-2 ----
function sm2(card,q){
  const c=card||{ef:2.5,reps:0,interval:0,due:0};
  if(q<3){ c.reps=0; c.interval=1; }
  else{ c.reps+=1; c.interval=c.reps===1?1:c.reps===2?6:Math.round(c.interval*c.ef); c.ef=Math.max(1.3,c.ef+(0.1-(5-q)*(0.08+(5-q)*0.02))); }
  c.due=Date.now()+c.interval*86400000; return c;
}
function allCards(lang){
  const out=[], seen=new Set();
  const add=(f,b)=>{ if(!seen.has(f)){ seen.add(f); out.push({f,b}); } };
  (CARDS[lang]||[]).forEach(c=>{ const t=(TR[lang]&&TR[lang][c[0]])||[c[1],c[1]]; add(c[0],{uk:c[1],ru:t[0],en:t[1]}); });
  for(const k of Object.keys(S.passed)){
    const [l,level,u,i]=k.split("-"); if(l!==lang) continue;
    const v=vocabLesson(level,+u,+i); if(!v||staticHasLesson(lang,level,+u,+i)) continue;
    v.w.forEach(r=>add(wordOf(r,lang),{uk:r[0],ru:r[1],en:r[2]}));
  }
  return out;
}
function dueCards(lang){ const now=Date.now(); return allCards(lang).filter(c=>{ const s=S.cards[`${lang}:${c.f}`]; return !s||s.due<=now; }); }

function levelLessonCount(lang,level){ let n=0; for(let u=1;u<=UNIT_COUNT;u++) if(allowed(level,u)) for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(lang,level,u,i)) n++; return n; }
function levelDone(lang,level){ let n=0; for(let u=1;u<=UNIT_COUNT;u++) if(allowed(level,u)) for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(lang,level,u,i)&&S.passed[lessonKey(lang,level,u,i)]) n++; return n; }
function levelUnlocked(level){
  const i=LEVELS.indexOf(level); if(i<=0) return true;
  const prev=LEVELS[i-1], total=levelLessonCount(S.lang,prev);
  return levelUnlocked(prev)&&total>0&&levelDone(S.lang,prev)>=total;
}
function unitStats(level,unit){
  let total=0,done=0;
  for(let i=1;i<=LESSONS_PER_UNIT;i++) if(hasLesson(S.lang,level,unit,i)){ total++; if(S.passed[lessonKey(S.lang,level,unit,i)]) done++; }
  return {total,done};
}
function canOpen(level,unit,idx){
  if(!levelUnlocked(level)||!allowed(level,unit)||!hasLesson(S.lang,level,unit,idx)) return false;
  for(let p=idx-1;p>=1;p--) if(hasLesson(S.lang,level,unit,p)) return !!S.passed[lessonKey(S.lang,level,unit,p)];
  return true;
}
function allLessonsInOrder(){ const out=[]; for(const L of LEVELS) for(let u=1;u<=UNIT_COUNT;u++) for(let i=1;i<=LESSONS_PER_UNIT;i++) out.push([L,u,i]); return out; }
function currentLesson(){ for(const [L,u,i] of allLessonsInOrder()) if(canOpen(L,u,i)&&!S.passed[lessonKey(S.lang,L,u,i)]) return {level:L,unit:u,idx:i}; return null; }
function nextAfter(level,unit,idx){
  let seen=false; for(const [L,u,i] of allLessonsInOrder()){ if(seen&&canOpen(L,u,i)) return {level:L,unit:u,idx:i}; if(L===level&&u===unit&&i===idx) seen=true; }
  return null;
}
function touchStreak(){

}

// ================= Голос =================
// 1) записані файли audio/<мова>/<хеш>.mp3, якщо вони є на сайті (працюють і в Telegram на Android);
// 2) інакше синтез мовлення пристрою з найприроднішим жіночим голосом.
let VOICES=[], AUDIO_INDEX=null;
function loadVoices(){ try{ VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; }catch(e){ VOICES=[]; } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=()=>{ loadVoices(); if(view==="pickVoice") render(); }; }
try{ fetch("audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ AUDIO_INDEX=j; }).catch(()=>{}); }catch(e){}
// Записи вимови живих людей з Wikimedia Commons (через Вікісловник), ліцензії CC BY / CC BY-SA / суспільне надбання
let REC=null;
try{ fetch("recordings.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ REC=j; if(j&&view==="lesson") render(); }).catch(()=>{}); }catch(e){}
function recKey(text,lang){ let s=String(text).replace(/[.!?¿¡]+$/,"").trim();
  if(lang==="de") s=s.replace(/^(der|die|das) /,"");
  if(lang==="it") s=s.replace(/^(il|lo|la|i|gli|le) /,"").replace(/^l'/,"");
  if(lang==="es") s=s.replace(/^(el|la|los|las) /,"");
  if(lang==="en") s=s.replace(/^(a|an|the|to) /,"");
  return s; }
function recFor(text,lang){ const t=REC&&REC[lang]; if(!t) return null; return t[recKey(text,lang)]||t[text]||null; }
function recUrls(r){ const orig="https://upload.wikimedia.org/wikipedia/commons/"+r[0], file=r[0].split("/").pop();
  const mp3="https://upload.wikimedia.org/wikipedia/commons/transcoded/"+r[0]+"/"+file+".mp3";
  const a=document.createElement("audio"); const oggOk=a.canPlayType&&a.canPlayType('audio/ogg; codecs="vorbis"');
  return /\.(ogg|oga|opus)$/i.test(file)&&!oggOk?[mp3,orig]:[orig,mp3]; }
function recCredit(text,lang,plain){ const r=recFor(text,lang); if(!r) return "";
  let f=r[0].split("/").pop(); try{ f=decodeURIComponent(f); }catch(e){}
  const label=`${ic("mic","xs")}${esc(r[1]||"Wikimedia Commons")} · ${esc(r[2]||"CC")}`;
  if(plain) return `<span class="credit">${label}</span>`;
  const page="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));
  return `<button class="credit" data-action="openLink" data-arg="${esc(page)}">${label}</button>`; }
function canSayWord(text,lang){ return !!(recFor(text,lang)||audioUrl(text,lang)||("speechSynthesis" in window&&voicesFor(lang).length)); }
function hashText(s){ let h=0x811c9dc5; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); }
function audioUrl(text,lang){ const h=hashText(text); const set=AUDIO_INDEX&&AUDIO_INDEX[lang]; return set&&(Array.isArray(set)?set.includes(h):set[h])?`audio/${lang}/${h}.mp3`:null; }
const FEMALE=/female|woman|frau|zira|hedda|katja|amala|anna|petra|marlene|vicki|zosia|ewa|paulina|agnieszka|zofia|maja|zuzana|iveta|vlasta|anu|everita|ona\b|kate|serena|samantha|karen|moira|tessa|susan|hazel|libby|sonia|martha|alice|federica|paola|elsa|isabella|monica|marisol|helena|laura|elvira|lucia|carmen|elena|julia|sara|google (deutsch|polski|italiano|eesti)/i;
const MALE=/\bmale\b|\bmann\b|stefan|markus|yannick|conrad|jacek|adam|antonin|kert|nils|leonas|diego|luca|cosimo|jorge|pablo|alvaro|daniel|arthur|george|ryan|thomas|oliver|rishi|giorgio|benigno|reed|fred|rocko|grandpa|eddy/i;
function voicesFor(lang){ const bcp=SPEECH[lang]||"en-GB", pre=bcp.split("-")[0].toLowerCase(); return VOICES.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(pre)); }
function voiceScore(v,bcp){
  return (FEMALE.test(v.name)?5:0)-(MALE.test(v.name)?6:0)+(/natural|neural|premium|enhanced|wavenet|online/i.test(v.name)?6:0)
    +(/google|microsoft|siri/i.test(v.name)?2:0)+(v.lang.toLowerCase().replace("_","-")===bcp.toLowerCase()?2:0);
}
function pickVoice(lang){
  const list=voicesFor(lang); if(!list.length) return null;
  const chosen=S.voices[lang]&&list.find(v=>v.voiceURI===S.voices[lang]); if(chosen) return chosen;
  const bcp=SPEECH[lang]||"en-GB"; return list.slice().sort((a,b)=>voiceScore(b,bcp)-voiceScore(a,bcp))[0];
}
function canVoice(lang){ return !!((REC&&REC[lang]&&Object.keys(REC[lang]).length)||(AUDIO_INDEX&&AUDIO_INDEX[lang])||("speechSynthesis" in window&&voicesFor(lang).length)); }
let currentAudio=null;
function stopSpeech(){ try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} try{ currentAudio&&currentAudio.pause(); }catch(e){} currentAudio=null; }
// Повертає проміс, що завершується, коли фраза дозвучала
function say(text,lang,btn){
  return new Promise(resolve=>{
    if(!S.sound||!text) return resolve(false);
    let done=false; const finish=ok=>{ if(done) return; done=true; if(btn) btn.classList.remove("playing"); resolve(ok); };
    const guard=setTimeout(()=>finish(true),Math.min(12000,1500+text.length*120));
    if(btn) btn.classList.add("playing");
    stopSpeech();
    const tts=()=>{
      if(!("speechSynthesis" in window)||!voicesFor(lang).length){ clearTimeout(guard); if(btn) toast(T("noVoice")); return finish(false); }
      try{
        const code=SPEECH[lang]||"en-GB", u=new SpeechSynthesisUtterance(text), v=pickVoice(lang);
        u.lang=v?v.lang:code; if(v) u.voice=v; u.rate=0.9; u.pitch=1.05;
        u.onend=()=>{ clearTimeout(guard); finish(true); }; u.onerror=()=>{ clearTimeout(guard); finish(false); };
        speechSynthesis.speak(u);
      }catch(e){ clearTimeout(guard); finish(false); }
    };
    const urls=[]; const r=recFor(text,lang); if(r) urls.push(...recUrls(r)); const own=audioUrl(text,lang); if(own) urls.unshift(own);
    const playNext=()=>{ const u=urls.shift(); if(!u) return tts();
      try{ const a=new Audio(u); currentAudio=a; a.onended=()=>{ clearTimeout(guard); finish(true); }; a.onerror=()=>playNext(); a.play().catch(()=>playNext()); }catch(e){ playNext(); } };
    if(urls.length) return playNext();
    return tts();
    if(!("speechSynthesis" in window)){ clearTimeout(guard); toast(T("noVoice")); return finish(false); }
    try{
      const code=SPEECH[lang]||"en-GB", u=new SpeechSynthesisUtterance(text), v=pickVoice(lang);
      u.lang=v?v.lang:code; if(v) u.voice=v; u.rate=0.9; u.pitch=1.05;
      u.onend=()=>{ clearTimeout(guard); finish(true); }; u.onerror=()=>{ clearTimeout(guard); finish(false); };
      speechSynthesis.speak(u);
    }catch(e){ clearTimeout(guard); finish(false); }
  });
}

// ================= Telegram Stars Payment =================
function buyPlan(planId){
  const price=PRICES[planId];
  if(!price) return;

  // Telegram WebApp invoice
  if(typeof Telegram!=="undefined"&&Telegram.WebApp&&Telegram.WebApp.openInvoice){
    // Build invoice URL - this needs a bot backend to create the invoice
    // For now, we use the simulated flow with Telegram.WebApp.openInvoice
    const invoiceUrl=buildInvoiceUrl(planId,price.stars);
    try{
      Telegram.WebApp.openInvoice(invoiceUrl,function(status){
        if(status==="paid"){
          setPlan(planId);
          localStorage.setItem("flueno-sub",JSON.stringify({plan:planId,type:"lifetime",date:new Date().toISOString()}));
          toast(T("subSuccess"));
          view="home"; tab="profile"; render();
        } else if(status==="cancelled"){
          // user cancelled, do nothing
        } else {
          toast(T("subError"));
        }
      });
    }catch(e){
      // Fallback: direct deep link to bot
      buyPlanFallback(planId);
    }
  } else {
    // Not in Telegram or no invoice support
    buyPlanFallback(planId);
  }
}

function buildInvoiceUrl(planId,stars){
  // Invoice URL format for Telegram Stars
  // The bot needs to handle /pay_{planId} command and return an invoice link
  // This creates a standard Telegram Stars invoice URL
  const botUsername="flueno_bot";
  return `https://t.me/$/${botUsername}/stars_${planId}_${stars}`;
}

function buyPlanFallback(planId){
  // Deep link to bot for payment
  const url=`https://t.me/flueno_bot?start=buy_${planId}`;
  if(typeof Telegram!=="undefined"&&Telegram.WebApp&&Telegram.WebApp.openTelegramLink){
    Telegram.WebApp.openTelegramLink(url);
  } else {
    window.open(url,"_blank");
  }
}

// Режим прослуховування: слово → пауза → переклад → наступна картка
async function runAutoplay(){
  if(!canVoice(S.lang)){ toast(T("noVoice")); return; }
  autoplay={on:true}; flipped=false; render();
  let i=0;
  while(autoplay&&autoplay.on&&deck.length&&tab==="cards"&&view==="home"){
    const c=deck[i%deck.length];
    const f=document.getElementById("flash"); if(f){ f.classList.remove("turned"); f.innerHTML=cardFaces(c); }
    flipped=false;
    await say(c.f,S.lang); if(!autoplay||!autoplay.on) break;
    await sleep(700); if(!autoplay||!autoplay.on) break;
    const f2=document.getElementById("flash"); if(f2) f2.classList.add("turned"); flipped=true;
    await say(c.b[S.ui]||c.b.uk,S.ui); if(!autoplay||!autoplay.on) break;
    await sleep(1200); i++;
  }
  autoplay=null; flipped=false; if(tab==="cards"&&view==="home") render();
}

// --- Глобальний пул сердець із таймером відновлення ---
const MAX_HEARTS=3, HEART_REFILL_MS=30*60*1000; // 30 хв на 1 серце
function getHearts(){
  if(PLAN==="plus"||PLAN==="pro") return {hearts:Infinity,ts:0};
  try{
    const d=JSON.parse(localStorage.getItem("flueno-hearts")||"null");
    if(!d) return {hearts:MAX_HEARTS,ts:Date.now()};
    let h=d.hearts, ts=d.ts||Date.now();
    if(h<MAX_HEARTS){ const elapsed=Date.now()-ts; const refilled=Math.floor(elapsed/HEART_REFILL_MS); if(refilled>0){ h=Math.min(MAX_HEARTS,h+refilled); ts=Date.now(); } }
    return {hearts:h,ts};
  }catch(e){ return {hearts:MAX_HEARTS,ts:Date.now()}; }
}
function saveHearts(h){
  if(PLAN==="plus"||PLAN==="pro") return;
  try{ localStorage.setItem("flueno-hearts",JSON.stringify({hearts:h,ts:Date.now()})); }catch(e){}
}
function loseHeart(){
  const d=getHearts(); if(d.hearts===Infinity) return Infinity;
  const n=Math.max(0,d.hearts-1); saveHearts(n); return n;
}
function startLesson(L,u,i){
  stopAutoplay();
  const key=lessonKey(S.lang,L,u,i), body=lessonBody(key);
  if(!body||!body.steps.length) return toast(T("soon"));
  const unlim=(PLAN==="plus"||PLAN==="pro");
  const hd=getHearts(), curH=unlim?Infinity:hd.hearts;
  if(!unlim&&curH<=0){ toast(T("gameOverTitle")); return; }
  session={key,level:L,unit:u,idx:i,body,step:0,chosen:null,ok:null,correct:0,total:0,orders:{},results:[],finished:false,passed:false,hearts:curH,maxHearts:unlim?Infinity:MAX_HEARTS,gameOver:false};
  view="lesson"; render(); window.scrollTo(0,0);
}
function orderFor(step){
  const s=session;
  if(!s.orders[s.step]){ s.orders[s.step]=shuffle(step.options.map((_,i)=>i)); }
  return s.orders[s.step];
}
function correctOrig(step){ return step.type==="quiz"?step.answer:step.options.findIndex(o=>o.ok); }
function lessonView(){
  const s=session, b=s.body, steps=b.steps;
  if(s.finished) return finishView();
  const step=steps[s.step];
  const segs=steps.map((_,i)=>`<i class="${(i<s.step||(i===s.step&&s.chosen!==null))?"on":""}"></i>`).join("");
  let body="", foot="";
  if(step.type==="explain"){
    body=`${s.step===0?`<div><h1>${esc(b.title)}</h1><p class="meta" style="margin-top:6px">${esc(b.goal)}</p></div>`:`<h1>${T("explain")}</h1>`}
      <div class="explain">${owl(56)}<div class="bubble">${esc(step.text)}</div></div>`;
    foot=`<button class="btn" data-action="cont">${T("cont")}</button>`;
  } else if(step.type==="words"){
    body=`<div><h1>${esc(b.title)}</h1><p class="meta" style="margin-top:6px">${T("wordsHint")}</p></div>
      <div class="list words">${step.items.map((it,k)=>`<div class="row"><span class="grow"><span class="title" lang="${S.lang}">${esc(it.w)}</span><span class="sub">${esc(it.g)}</span>${recCredit(it.w,S.lang)}</span>
        <button class="mini" data-action="sayWord" data-arg="${k}" aria-label="${T("listen")}">${ic("volume","sm")}</button></div>`).join("")}</div>`;
    foot=`<button class="btn" data-action="cont">${T("cont")}</button>`;
  } else {
    const order=orderFor(step), right=correctOrig(step);
    const texts=step.type==="quiz"?step.options:step.options.map(o=>o.text);
    const opts=order.map((orig,d)=>{
      let cls=""; if(s.chosen!==null){ cls=orig===right?"right":d===s.chosen?"wrong":"dim"; }
      const t=texts[orig];
      return `<button class="opt ${cls}" data-action="answer" data-arg="${d}" ${s.chosen!==null?"disabled":""} ${(step.optionsLocalized||step.uiOpts||hasCyr(t))?"":`lang="${S.lang}"`}>
        <span class="key">${"ABCD"[d]}</span><span>${esc(t)}</span></button>`;
    }).join("");
    if(step.type==="quiz"&&step.listen) body=`<h1>${esc(step.question)}</h1>
      <button class="listen-big" data-action="sayStep" aria-label="${T("playAgain")}">${ic("volume")}<span>${T("playAgain")}</span></button><div class="opts">${opts}</div>`;
    else if(step.type==="quiz") body=`<h1>${esc(step.question)}</h1><div class="opts">${opts}</div>`;
    else{
      body=`<h1>${T("situation")}</h1><div class="scene">${ic("chat")}<span>${esc(step.scene)}</span></div><div class="opts">${opts}</div>`;
      if(s.chosen!==null&&s.ok){
        const reply=step.options[order[s.chosen]].reply;
        body+=`<div class="reply"><span class="who">${ic("user","sm")}</span><div class="bubble"><span lang="${S.lang}">${esc(reply)}</span>
          <button class="mini" data-action="listenReply" aria-label="${T("listen")}">${ic("volume","sm")}</button></div></div>`;
      }
    }
    if(s.chosen===null) foot=`<p class="meta" style="text-align:center">${T("pick")}</p>`;
    else{
      const ok=s.ok; let note="";
      if(step.type==="quiz") note=step.explain; else if(!ok) note=step.options[order[s.chosen]].reply;
      const sayText=step.say||(!step.optionsLocalized&&!step.uiOpts&&!hasCyr(texts[right])&&step.type==="quiz"?texts[right]:null);
      foot=`<div class="fb ${ok?"ok":"bad"}"><div class="fb-head">${ic(ok?"checkCircle":"xCircle")}${ok?T("correct"):T("wrong")}</div>
        ${note?`<p>${esc(note)}</p>`:""}
        <div class="fb-row">${sayText?`<button class="mini" data-action="sayAnswer" aria-label="${T("listen")}">${ic("volume")}</button>`:""}
        <button class="btn ${ok?"ok":"bad"}" data-action="cont">${T("cont")}</button></div></div>`;
    }
  }
  return `<div class="lesson">
    <div class="lesson-top"><button class="iconbtn" data-action="closeLesson" aria-label="${T("close")}">${ic("close")}</button>
      <div class="segs" aria-hidden="true">${segs}</div>${heartsBar()}<span class="code">${s.level}</span></div>
    <div class="lesson-body">${body}</div>
    <div class="lesson-foot">${foot}</div></div>`;
}
function finishView(){
  const s=session, next=s.passed?nextAfter(s.level,s.unit,s.idx):null;
  return `<div class="lesson"><div class="lesson-top"><button class="iconbtn" data-action="closeLesson" aria-label="${T("close")}">${ic("close")}</button>
      <div class="segs" aria-hidden="true">${s.body.steps.map(()=>`<i class="on"></i>`).join("")}</div><span class="code">${s.level}</span></div>
    <div class="finish">${owl(130,s.passed?"happy":"",s.passed?"cheer":"")}
      <h1>${s.passed?T("lessonDone"):T("lessonRetry")}</h1><p class="meta">${esc(s.body.title)}</p>
      ${s.results.length?`<div class="marks" aria-hidden="true">${s.results.map(r=>`<span class="mark ${r?"ok":"bad"}">${ic(r?"check":"close","xs")}</span>`).join("")}</div>`:""}
      <p class="meta num">${T("scoreLine",{c:s.correct,t:s.total})}</p>
      <div class="actions">
        ${next?`<button class="btn" data-action="nextLesson">${T("nextLesson")}${ic("arrowRight","sm")}</button>`:""}
        ${!s.passed?`<button class="btn" data-action="retry">${T("retry")}</button>`:""}
        <button class="btn quiet" data-action="closeLesson">${T("toRoute")}</button>

function heartIcon(full){
  return `<svg viewBox="0 0 24 24" fill="${full?"currentColor":"none"}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
}
function heartsBar(){
  const s=session; if(!s||s.maxHearts===Infinity) return "";
  let h="";
  for(let i=0;i<s.maxHearts;i++) h+=`<span class="${i<s.hearts?"":"empty"}">${heartIcon(i<s.hearts)}</span>`;
  return `<div class="hearts-bar">${h}</div>`;
}
function gameOverModal(){
  const s=session; if(!s||!s.gameOver) return "";
  const hd=getHearts(), canRetry=hd.hearts>0;
  let waitLine="";
  if(!canRetry){
    const elapsed=Date.now()-hd.ts;
    const left=Math.max(1,Math.ceil((HEART_REFILL_MS-elapsed)/60000));
    waitLine=`<p class="meta" style="color:var(--accent-ink)">${T("gameOverWait",{m:left})}</p>`;
  }
  return `<div class="game-over-overlay" data-action="closeGameOver">
    <div class="game-over-card" onclick="event.stopPropagation()">
      <div class="hearts-big">${heartIcon(false)}${heartIcon(false)}${heartIcon(false)}</div>
      ${owl(100)}
      <h2>${T("gameOverTitle")}</h2>
      <p class="meta">${T("gameOverDesc")}</p>
      ${waitLine}
      <div class="actions">
        <button class="btn" data-action="openSub">${T("gameOverSub")} ${ic("arrowRight","sm")}</button>
        <button class="btn quiet" data-action="retryAfterGameOver" ${canRetry?"":"disabled"}>${T("gameOverRetry")}</button>
      </div>
    </div>
  </div>`;
}
function answer(d){
  const s=session; if(!s||s.chosen!==null||s.gameOver) return;
  const step=s.body.steps[s.step], orig=orderFor(step)[d];
  s.chosen=d; s.ok=orig===correctOrig(step); s.total++; if(s.ok) s.correct++; s.results.push(s.ok);
  if(!s.ok&&s.hearts!==Infinity){ s.hearts=loseHeart(); if(s.hearts<=0){ s.gameOver=true; haptic("error"); render(); return; } }
  // Слово з квізу потрапляє в картки з оцінкою за відповіддю
  if(step.say&&s.body.kind){ const key=S.lang+":"+step.say; S.cards[key]=sm2(S.cards[key],s.ok?4:1); save(); }
  haptic(s.ok?"success":"error"); render();
}
function cont(){
  const s=session; if(!s) return;
  const step=s.body.steps[s.step];
  if(step.type!=="explain"&&step.type!=="words"&&s.chosen===null) return;
  s.step++; s.chosen=null; s.ok=null;
  if(s.step>=s.body.steps.length){
    s.finished=true; s.passed=s.total===0||s.correct>=s.total*0.6;
    if(s.passed){
      const wasDone=levelDone(S.lang,s.level)>=levelLessonCount(S.lang,s.level);
      S.passed[s.key]=true; haptic("success");
      const nowDone=levelDone(S.lang,s.level)>=levelLessonCount(S.lang,s.level);
      if(!wasDone&&nowDone&&LEVELS.indexOf(s.level)<LEVELS.length-1) setTimeout(()=>toast(T("msgLevel")),600);
    } else haptic("error");
    touchStreak(); save();
  }
  render(); window.scrollTo(0,0);
  const nxt=!s.finished&&s.body.steps[s.step];
  if(nxt&&nxt.listen) say(nxt.say,S.lang); // натискання «Продовжити» дозволяє браузеру одразу відтворити звук
}
function closeLesson(){ session=null; view="home"; tab="learn"; unitShown="auto"; render(); window.scrollTo(0,0); }
function goBack(){ if(view==="lesson") return closeLesson(); if(["pickUi","pickLang","pickVoice","subscription"].includes(view)){ view="home"; render(); } }
function confirmReset(){
  const doReset=()=>{ S={...defaults,ui:S.ui,lang:S.lang,sound:S.sound,voices:S.voices}; save(); deck=[]; unitShown="auto"; render(); toast(T("resetOk")); };
  try{ if(inTg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")) return tg.showConfirm(T("resetQ"),ok=>{ if(ok) doReset(); }); }catch(e){}
  try{ if(window.confirm(T("resetQ"))) doReset(); }catch(e){}
}

document.addEventListener("click",(e)=>{
  const el=e.target.closest("[data-action]"); if(!el||el.disabled) return;
  const a=el.dataset.action, arg=el.dataset.arg;
  switch(a){
    case "setUi": S.ui=arg; save(); if(view==="pickUi"){ view="home"; tab="profile"; } return render();
    case "setLang": stopAutoplay(); S.lang=arg; save(); view="home"; tab="learn"; deck=[]; unitShown="auto"; render(); return window.scrollTo(0,0);
    case "tab": stopAutoplay(); tab=arg; view="home"; deck=[]; flipped=false; render(); return window.scrollTo(0,0);
    case "pickLang": case "pickUi": case "pickVoice": stopAutoplay(); view=a; render(); return window.scrollTo(0,0);
    case "setVoice": if(arg) S.voices[S.lang]=arg; else delete S.voices[S.lang]; save(); render(); return say(allCards(S.lang)[0]?allCards(S.lang)[0].f:"",S.lang);
    case "testVoice": { const prev=S.voices[S.lang]; if(arg) S.voices[S.lang]=arg; else delete S.voices[S.lang];
      const p=say(allCards(S.lang)[0]?allCards(S.lang)[0].f:"",S.lang,el); if(prev) S.voices[S.lang]=prev; else delete S.voices[S.lang]; return p; }
    case "back": return goBack();
    case "unit": unitShown= openUnitKey()===arg?null:arg; return render();
    case "plusOnly": view="subscription"; render(); return window.scrollTo(0,0);
    case "openSub": view="subscription"; render(); return window.scrollTo(0,0);
    case "buyPlan": return buyPlan(arg);
    case "soon": return toast(T("soon"));
    case "lesson": { const [L,u,i]=arg.split("|"); if(!levelUnlocked(L)) return toast(T("levelLocked",{lv:LEVELS[LEVELS.indexOf(L)-1]}));
      if(!canOpen(L,+u,+i)) return toast(T("lockedLesson")); return startLesson(L,+u,+i); }
    case "review": tab="cards"; deck=[]; flipped=false; render(); return window.scrollTo(0,0);
    case "flip": if(autoplay&&autoplay.on) return; return setFlip(!flipped);
    case "listenCard": return deck.length&&say(deck[0].f,S.lang,el);
    case "rate": return rateCard(+arg);
    case "autoplay": return runAutoplay();
    case "stopAutoplay": return stopAutoplay();
    case "answer": return answer(+arg);
    case "cont": return cont();
    case "sayWord": { const st=session.body.steps[session.step]; return say(st.items[+arg].w,S.lang,el); }
    case "sayStep": { const st=session.body.steps[session.step]; return say(st.say,S.lang,el); }
    case "sayAnswer": { const st=session.body.steps[session.step]; return say(st.say||st.options[st.answer],S.lang,el); }
    case "listenReply": { const st=session.body.steps[session.step], o=orderFor(st)[session.chosen]; return say(st.options[o].reply,S.lang,el); }
    case "closeLesson": return closeLesson();
    case "retry": return startLesson(session.level,session.unit,session.idx);
    case "retryAfterGameOver": return startLesson(session.level,session.unit,session.idx);
    case "closeGameOver": if(session) session.gameOver=false; return closeLesson();
    case "nextLesson": { const n=nextAfter(session.level,session.unit,session.idx); return n?startLesson(n.level,n.unit,n.idx):closeLesson(); }
    case "toggleSound": S.sound=!S.sound; save(); if(!S.sound) stopSpeech(); return render();
    case "reset": return confirmReset();
    case "openLink": try{ if(inTg&&tg.openLink) return tg.openLink(arg); }catch(err){} try{ window.open(arg,"_blank","noopener"); }catch(err){} return;
  }
});
// Хостинг може додати свою закріплену смужку внизу. Не ховаємо її, а піднімаємо свої нижні елементи над нею.
function measureHostBar(){
  let h=0;
  for(const el of document.body.children){
    if(el.id==="app"||el.id==="nav"||el.id==="toast"||el.tagName==="SCRIPT") continue;
    const cs=getComputedStyle(el);
    if(cs.position==="fixed"&&cs.display!=="none"&&cs.visibility!=="hidden"){
      const r=el.getBoundingClientRect();
      if(r.height>0&&r.height<160&&Math.abs(r.bottom-window.innerHeight)<2) h=Math.max(h,Math.round(r.height));
    }
  }
  document.documentElement.style.setProperty("--host-bar",h+"px");
}
try{ new MutationObserver(measureHostBar).observe(document.body,{childList:true}); }catch(e){}
window.addEventListener("resize",measureHostBar);
[300,1200,3000].forEach(t=>setTimeout(measureHostBar,t));
applyTheme();
render();
measureHostBar();
</script>
